[package]
name = "primes"
version = "0.1.0"
edition = "2024"
publish = false
description = "The smallest factor of a number, compiled to WebAssembly for the prime checker."

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
