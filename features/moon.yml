language: "typescript"
layer: "automation"

project:
  title: "Features"
  description: "The Gherkin features and the adapter proofs."

toolchains:
  default: ["javascript", "node", "pnpm"]

tasks:
  test:
    description: "Run the features (the capabilities and the targets) and the CLI and MCP proofs."
    command: "vp"
    args: ["test", "run"]
    deps:
      - target: "cli:build"
        cacheStrategy: "outputs"
      - target: "primes-wasm:build"
        cacheStrategy: "outputs"
    inputs: ["**/*", "/packages/*/src/**/*.ts", "/packages/*/package.json"]
