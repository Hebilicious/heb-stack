overrides:
  # One XState core for every consumer, the one @xstate/effect pairs with.
  "xstate@*": "catalog:"
  # Alchemy's Effect 4 build is published to its own registry, which names each sub-package by a content-hashed URL.
  # These hold every one of them to the catalog's pin.
  "@alchemy.run/cloudflare-runtime": "catalog:"
  "@alchemy.run/floci": "catalog:"
  "@alchemy.run/node-utils": "catalog:"
  "@distilled.cloud/acme": "catalog:"
  "@distilled.cloud/zerossl": "catalog:"
  "@distilled.cloud/aws": "catalog:"
  "@distilled.cloud/axiom": "catalog:"
  "@distilled.cloud/cloudflare": "catalog:"
  "@distilled.cloud/core": "catalog:"
  "@distilled.cloud/doppler": "catalog:"
  "@distilled.cloud/fly-io": "catalog:"
  "@distilled.cloud/hetzner": "catalog:"
  "@distilled.cloud/infisical": "catalog:"
  "@distilled.cloud/neon": "catalog:"
  "@distilled.cloud/planetscale": "catalog:"
  "@distilled.cloud/prisma": "catalog:"
  "@distilled.cloud/railway": "catalog:"
  "@distilled.cloud/stripe": "catalog:"
  "@alchemy.run/frontend-frameworks": "catalog:"

# Off only while Alchemy's Effect 4 build lives on its own registry: it names its sub-packages by URL, which pnpm
# otherwise refuses below the workspace's own manifests. Every such URL is pinned by content hash in the catalog.
blockExoticSubdeps: false

allowBuilds:
  esbuild: true
  workerd: true
  # Its postinstall writes git hooks; `moon run app:hooks-install` does that on purpose.
  lefthook: false

minimumReleaseAgeExclude:
  - "@effect/atom-vue@4.0.0"
  - "@effect/platform-node-shared@4.0.0"
  - "@effect/platform-node@4.0.0"
  - "@effect/tsgo-darwin-arm64@0.47.2"
  - "@effect/tsgo-darwin-x64@0.47.2"
  - "@effect/tsgo-linux-arm64@0.47.2"
  - "@effect/tsgo-linux-arm@0.47.2"
  - "@effect/tsgo-linux-x64@0.47.2"
  - "@effect/tsgo-win32-arm64@0.47.2"
  - "@effect/tsgo-win32-x64@0.47.2"
  - "@effect/tsgo@0.47.2"
  - "@xstate/effect@0.1.0-alpha.6"
  - effect@4.0.0
  - vite@8.3.2
  - "@cloudflare/workers-types@5.20261001.1"
