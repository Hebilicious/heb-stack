packages:
  - "."
  - "apps/*"
  - "packages/*"
  - "workers/*"

# Every dependency is pinned exactly, once, here. Workspace packages name `catalog:` and never a version.
catalog:
  "@acid-cat/catalog": 0.18.0
  "@acid-cat/cli": 0.18.0
  "@acid-cat/core-effect": 0.18.0
  "@acid-cat/spec-ts": 0.18.0
  "@alchemy.run/cloudflare": 2.0.0-beta.87
  "@cloudflare/workers-types": 5.20261125.1
  "@cucumber/cucumber-expressions": 20.2.0
  "@cucumber/gherkin": 43.0.0
  "@cucumber/messages": 35.0.0
  "@cucumber/tag-expressions": 11.2.0
  "@effect/atom-vue": 4.1.5
  "@effect/platform-node": 4.1.5
  "@effect/platform-node-shared": 4.1.5
  "@effect/tsgo": 0.73.4
  "@gommage/cli": 0.1.0
  "@hebilicious/cssforge": 0.11.1
  "@hebilicious/cssforge-unplugin": 0.1.3
  "@oxlint/plugins": 1.95.0
  "@playwright/test": 1.65.1
  "@types/node": 26.6.9
  "@vizejs/vite-plugin": 0.795.0
  "@xstate/effect": 1.0.0-beta.3
  alchemy: 2.0.0-beta.87
  capnweb: 0.13.1
  effect: 4.1.5
  lefthook: 2.2.2
  oxfmt: 0.80.0
  oxlint: 1.95.0
  oxlint-tsgolint: 7.0.2008
  typescript: 7.0.2
  ultracite: 8.3.1
  vite-plus: 1.8.0
  vize: 0.795.0
  vue: 3.6.0-rc.16
  xstate: 6.0.0-beta.5

overrides:
  # Vite+ installs its core as `vite` and pins the Vitest it bundles. Every plugin and runner that asks for `vite` or
  # `vitest` resolves to those same copies, so the build, the dev server and `vp test` load one Vite and one Vitest.
  vite: "npm:@voidzero-dev/vite-plus-core@8.3.8001"
  vitest: 5.1.1
  # One XState core for every consumer, the one @xstate/effect pairs with.
  "xstate@*": "catalog:"
  # The platform-node-shared of our platform-node, at the effect version we pin; otherwise it dedupes to the newer one
  # @acid-cat/cli brings, which needs a newer effect.
  "@effect/platform-node@4.1.5>@effect/platform-node-shared": "catalog:"

allowBuilds:
  esbuild: true
  workerd: true
  # Its postinstall writes git hooks; `moon run app:hooks-install` does that on purpose.
  lefthook: false

minimumReleaseAgeExclude:
  - "@acid-cat/*"
  - "@cloudflare/workers-types@5.20261125.1"
  - "@types/node@26.6.9"
  - "@vizejs/native-darwin-arm64@0.795.0"
  - "@vizejs/native-darwin-x64@0.795.0"
  - "@vizejs/native-linux-arm64-gnu@0.795.0"
  - "@vizejs/native-linux-arm64-musl@0.795.0"
  - "@vizejs/native-linux-x64-gnu@0.795.0"
  - "@vizejs/native-linux-x64-musl@0.795.0"
  - "@vizejs/native-win32-arm64-msvc@0.795.0"
  - "@vizejs/native-win32-x64-msvc@0.795.0"
  - "@vizejs/native@0.795.0"
  - "@vizejs/unplugin@0.795.0"
  - "@vizejs/vite-plugin@0.795.0"
  - vize@0.795.0

permissions:
  # Ultracite ships agent skills; skills are installed into .agents/skills on purpose, never by a dependency.
  ultracite:
    skills: false
