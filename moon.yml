language: "typescript"
layer: "automation"

project:
  title: "heb-stack"
  description: "Repository-wide checks, the git hooks, and the one task that runs every proof."

toolchains:
  default: ["javascript", "node", "pnpm"]

fileGroups:
  typescript:
    - "packages/*/src/**/*.ts"
    - "packages/*/*.ts"
    - "packages/*/scripts/**/*.ts"
    - "apps/web/src/**/*.ts"
    - "workers/api/src/**/*.ts"
    - "features/**/*.ts"
    - "e2e/**/*.ts"
    - "tools/**/*.ts"
    - "*.config.ts"
  configs:
    - "tsconfig.json"
    - "tsconfig.base.json"
    - "package.json"
    - "pnpm-workspace.yaml"

tasks:
  verify:
    description: "Every check and every proof: formatting, lint, types, Effect diagnostics, authorship, the tests, the features, the browser and the crate."
    command: "noop"
    deps:
      - "format-check"
      - "lint"
      - "typecheck"
      - "effect-diagnostics"
      - "authorship-check"
      - "web:format-check"
      - "web:lint"
      - "web:typecheck"
      - "acidcat:catalog-check"
      - "api:typecheck"
      - "primes:test"
      - "features:test"
      - "e2e:test"
      - "primes-wasm:format-check"
      - "primes-wasm:lint"
      - "primes-wasm:test"

  dev:
    description: "Rebuild the page on every change and serve it with /rpc and /mcp on http://localhost:1337."
    command: "noop"
    deps: ["web:dev", "api:dev"]
    options:
      runDepsInParallel: true

  lint:
    description: "Lint every TypeScript file with Ultracite's rules, the anti-slop rules and the Effect rules, type-aware, denying warnings."
    command: "oxlint"
    args: ["--type-aware", "--deny-warnings"]
    inputs: ["@group(typescript)", "@group(configs)", "oxlint.config.ts"]

  format:
    description: "Format the repository with oxfmt and Ultracite's settings."
    command: "oxfmt"
    args: ["."]
    options:
      cache: false

  format-check:
    description: "Check the repository's formatting without changing a file."
    command: "oxfmt"
    args: ["--check", "."]
    options:
      cache: false

  typecheck:
    description: "Type-check the packages, the evidence and the configs."
    command: "tsc"
    args: ["-p", "tsconfig.json"]
    inputs: ["@group(typescript)", "@group(configs)"]

  effect-diagnostics:
    description: "Fail on Effect language-service errors and warnings."
    command: "effect-tsgo"
    args: ["diagnostics", "--project", "tsconfig.json", "--format", "text", "--severity", "error,warning"]
    inputs: ["@group(typescript)", "@group(configs)"]

  authorship-check:
    description: "Refuse AI attribution in the commits this branch adds; pass a range after -- to check another."
    command: "gommage"
    args: ["check"]
    inputs: [".gommage.yml"]
    options:
      cache: false

  authorship-fix:
    description: "Strip AI attribution from the commits of the range passed after --, rewriting them in place."
    command: "gommage"
    args: ["fix", "--repo", "."]
    inputs: [".gommage.yml"]
    options:
      cache: false
      runInCI: "skip"

  hooks-install:
    description: "Install the lefthook git hooks for this clone."
    command: "lefthook"
    args: ["install"]
    inputs: ["lefthook.yml"]
    options:
      cache: false
      runInCI: "skip"
