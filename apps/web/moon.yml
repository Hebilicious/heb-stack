language: "typescript"
layer: "application"

project:
  title: "Web"
  description: "The prime checker page: Vue Vapor, built by Vite and vize, styled with cssforge."

toolchains:
  default: ["javascript", "node", "pnpm"]

fileGroups:
  sources:
    - "src/**/*"
    - "index.html"
    - "cssforge.config.ts"
    - "vize.config.ts"
    - "vite.config.ts"
    - "tsconfig.json"
    - "/packages/*/src/**/*.ts"
    - "/packages/*/package.json"

tasks:
  build:
    description: "Build the page into dist."
    command: "vite"
    args: ["build"]
    inputs: ["@group(sources)"]
    outputs: ["dist/**/*"]

  dev:
    description: "Rebuild the page into dist whenever a source changes."
    command: "vite"
    args: ["build", "--watch"]
    preset: "server"

  typecheck:
    description: "Type-check the page with vize."
    command: "vize"
    args: ["check", "--tsconfig", "tsconfig.json", "src"]
    inputs: ["@group(sources)"]

  lint:
    description: "Lint the Vue components with vize, denying warnings."
    command: "vize"
    args: ["lint", "--max-warnings", "0", "src"]
    inputs: ["src/**/*", "vize.config.ts"]

  format:
    description: "Format the Vue components with vize."
    command: "vize"
    args: ["fmt", "--write", "src/**/*.vue"]
    options:
      cache: false

  format-check:
    description: "Check the Vue components' formatting with vize."
    command: "vize"
    args: ["fmt", "--check", "src/**/*.vue"]
    inputs: ["src/**/*.vue", "vize.config.ts"]
