projects:
  app: "."
  api-worker: "workers/api"
  primes: "crates/primes"

defaultProject: "app"
telemetry: false
versionConstraint: ">=2.5.6 <2.6.0"

vcs:
  defaultBranch: "main"

hasher:
  walkStrategy: "glob"
  ignorePatterns:
    - "**/node_modules/**"
    - "**/.vize/**"
    - "**/.wrangler/**"
    - "**/.cloudflare/**"
    - ".artifacts/**"
    - "**/dist/**"
    - "crates/primes/target/**"

pipeline:
  installDependencies:
    - "javascript"
