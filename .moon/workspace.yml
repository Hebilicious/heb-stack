projects:
  app: "."
  web: "apps/web"
  api: "workers/api"
  cli: "packages/cli"
  application-primes: "packages/application-primes"
  primes: "crates/primes"
  features: "features"
  e2e: "e2e"

defaultProject: "app"
telemetry: false
versionConstraint: ">=2.5.6 <2.6.0"

vcs:
  defaultBranch: "main"

hasher:
  walkStrategy: "glob"
  ignorePatterns:
    - "**/node_modules/**"
    - "**/.vize/**"
    - "**/.alchemy/**"
    - ".artifacts/**"
    - "**/dist/**"
    - "crates/primes/target/**"

pipeline:
  installDependencies:
    - "javascript"
