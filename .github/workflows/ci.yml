name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: moon run app:verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The authorship check reads the commits a branch adds to origin/main, so it needs the full history.
        with:
          fetch-depth: 0

      # proto installs the Node, pnpm and moon that .prototools pins.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        env:
          PROTO_LOG: debug
        with:
          auto-install: true
          cache-version: diag2

      - run: |
          rustup toolchain list -v; ls -la ~/.rustup/toolchains; ls ~/.rustup/toolchains/1.99*/bin || true
          ls ~/.rustup/toolchains/1.99*/lib/rustlib || true; cat ~/.rustup/toolchains/1.99*/lib/rustlib/components || true
          cat ~/.rustup/settings.toml; env | grep -i -E "rust|cargo|proto" | sort
        continue-on-error: true
        env:
          RUSTUP_AUTO_INSTALL: "0"

      - run: pnpm install --frozen-lockfile

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/primes

      - id: playwright
        run: echo "version=$(pnpm exec playwright --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - run: moon run app:verify
